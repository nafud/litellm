# /etc/sysctl.d/90-hardening.conf  (apply: sysctl --system)
# The CIS Build Kit already set (docs/01 §1.11, /etc/sysctl.d/60-*.conf): suid_dumpable,
# dmesg_restrict, randomize_va_space, ptrace_scope, IPv4 redirects/source routing/
# forwarding/log_martians/all.rp_filter/syncookies/icmp, IPv6 accept_ra/redirects/
# source routing/forwarding. This file adds only what is missing.
net.ipv4.conf.default.rp_filter = 1
kernel.kptr_restrict = 2
kernel.unprivileged_bpf_disabled = 1
fs.protected_hardlinks = 1
fs.protected_symlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
# Deliberately NOT set:
#  net.ipv4.ip_forward      CIS keeps forwarding off; rootless Podman does not need it on the host.
#  user.max_user_namespaces rootless Podman needs user namespaces; keep the RHEL default (> 0).
