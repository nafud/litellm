# Install as /etc/systemd/system/auditd.service.d/10-log-ratelimit.conf (docs/04 §4.5).
# Audit records reach rsyslog through the auditd syslog plugin and journald (docs/02 §2.5).
# journald rate-limits each unit to RateLimitBurst per RateLimitIntervalSec (10000 per
# 30 s by default) and drops the rest; audit records must never be dropped. 0 disables
# the limit for this unit only (systemd.exec(5), LogRateLimitIntervalSec=).
[Service]
LogRateLimitIntervalSec=0
