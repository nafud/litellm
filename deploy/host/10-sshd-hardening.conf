# /etc/ssh/sshd_config.d/10-sshd-hardening.conf
# RHEL's sshd_config starts with "Include /etc/ssh/sshd_config.d/*.conf" and sshd keeps the
# first value it reads, so this drop-in overrides the main file. Ciphers/MACs/KEX are left
# to the system-wide crypto policy (update-crypto-policies --show: DEFAULT or FUTURE).
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
PermitEmptyPasswords no
# Replace with the admin account(s). The service account llmgw never logs in over SSH.
AllowUsers infosec
MaxAuthTries 3
LoginGraceTime 30
X11Forwarding no
AllowAgentForwarding no
# Local port forwarding is kept: the admin UI is reached through "ssh -L 4000:127.0.0.1:4000".
AllowTcpForwarding local
ClientAliveInterval 300
ClientAliveCountMax 2
