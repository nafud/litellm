# /etc/ssh/sshd_config.d/10-sshd-hardening.conf
# sshd keeps the FIRST value it reads for a keyword. On this host the CIS Build Kit wrote
# its settings into /etc/ssh/sshd_config ABOVE the "Include /etc/ssh/sshd_config.d/*.conf"
# line (docs/01 §1.11), so those CIS values are authoritative and a drop-in cannot change
# them: PermitRootLogin no, PermitEmptyPasswords no, MaxAuthTries 4, LoginGraceTime 60,
# ClientAliveInterval 15 / ClientAliveCountMax 3, LogLevel VERBOSE, MaxStartups, MaxSessions,
# HostbasedAuthentication no, IgnoreRhosts yes, PermitUserEnvironment no, Banner,
# AllowUsers/AllowGroups devops sysadmin, DenyUsers/DenyGroups root.
# This file only sets what CIS did not. It sorts before RHEL's 50-redhat.conf, so it wins
# over that file within the include. Ciphers/MACs/KEX stay with the crypto policy.
PasswordAuthentication no
KbdInteractiveAuthentication no
PubkeyAuthentication yes
X11Forwarding no
AllowAgentForwarding no
# Local port forwarding is kept: the admin UI is reached through "ssh -L 4000:127.0.0.1:4000".
AllowTcpForwarding local
# AllowUsers is NOT set here: it accumulates across files; "AllowUsers devops sysadmin" in
# /etc/ssh/sshd_config stays authoritative. llmgw is never listed.
