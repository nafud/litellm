# ~llmgw/.config/containers/storage.conf
# Keeps the rootless image/container store under /opt as required. runroot is left at
# its default (/run/user/<uid>/containers): containers-storage.conf(5) says a rootless
# config that omits it keeps the default. With SELinux enabled, the new path must carry
# the same labels as the default location (docs/03 §3.5):
#   semanage fcontext -a -e /home/llmgw/.local/share/containers /opt/llm-gateway/storage
#   restorecon -R -v /opt/llm-gateway/storage
[storage]
driver = "overlay"
graphroot = "/opt/llm-gateway/storage"
